name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: librepo-get-linux-x86_64.a
            pattern: '*.a'
          - os: ubuntu-24.04-arm
            asset: librepo-get-linux-arm64.a
            pattern: '*.a'
          - os: windows-latest
            asset: repo-get-windows-x86_64.lib
            pattern: '*.lib'
          - os: windows-11-arm
            asset: repo-get-windows-arm64.lib
            pattern: '*.lib'
          - os: macos-latest
            asset: librepo-get-macos-arm64.a
            pattern: '*.a'
    steps:
      - uses: actions/checkout@v4
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build
        run: dub build -b release
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${{ matrix.pattern }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No library artifact matching ${{ matrix.pattern }}" >&2
            ls -la
            exit 1
          fi
          cp "${files[0]}" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
